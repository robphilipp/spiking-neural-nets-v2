[package]
name = "spikes-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "spikes"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
spikes-api = { version = "0.1.0", path = "../../crates/spikes-api" }
spikes-dna = { version = "0.1.0", path = "../../crates/spikes-dna" }
spikes-record = { version = "0.1.0", path = "../../crates/spikes-record" }
spikes-session = { version = "0.1.0", path = "../../crates/spikes-session" }
tempo-runtime = { version = "0.1.0", path = "../../crates/tempo-runtime" }

[lints]
workspace = true
