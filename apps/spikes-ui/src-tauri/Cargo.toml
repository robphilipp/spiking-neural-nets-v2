[package]
name = "spikes-desktop"
description = "The Spikes desktop app: the UI with the engine built in"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "spikes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "spikes-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
spikes-api = { version = "0.1.0", path = "../../../crates/spikes-api" }
spikes-session = { version = "0.1.0", path = "../../../crates/spikes-session" }
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[lints]
workspace = true
