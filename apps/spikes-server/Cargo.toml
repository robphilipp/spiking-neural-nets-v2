[package]
name = "spikes-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.9", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.154"
spikes-api = { version = "0.1.0", path = "../../crates/spikes-api" }
spikes-session = { version = "0.1.0", path = "../../crates/spikes-session" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[lints]
workspace = true
